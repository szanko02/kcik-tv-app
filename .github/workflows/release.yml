name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v2.5.0). Leave empty to use v<baseVersion>-<sha>.'
        required: false
        type: string
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        type: boolean
        default: false
      release_notes:
        description: 'Optional release notes (defaults to CHANGELOG.md / git log)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Translations
        run: |
          python3 scripts/verify_translations_strict.py
          python3 scripts/translate_ru.py --validate-only

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Used real google-services.json from secrets"
          else
            cp app/google-services.json.example app/google-services.json
            echo "Used mock google-services.json from example file"
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Resolve Version and Changelog
        id: meta
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "has_signing_key=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$REF_TYPE" = "tag" ]; then
              echo "::error::SIGNING_KEY secret is required for tagged releases" >&2
              exit 1
            fi
            echo "has_signing_key=false" >> "$GITHUB_OUTPUT"
          fi

          VERSION_BASE=$(grep 'val baseVersion =' app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG_NAME="$REF_NAME"
            VERSION="${REF_NAME#v}"
            VERSION="${VERSION#V}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
            VERSION="${INPUT_TAG#v}"
            VERSION="${VERSION#V}"
          else
            VERSION="${VERSION_BASE}-${SHORT_SHA}"
            TAG_NAME="v${VERSION}"
          fi

          if [ "$INPUT_PRERELEASE" = "true" ]; then
            IS_PRERELEASE="true"
          elif [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

          NOTES=""
          if [ -n "$INPUT_NOTES" ]; then
            NOTES="$INPUT_NOTES"
          else
            NOTES=$(python3 - "$VERSION" "$VERSION_BASE" << 'PYEOF'
          import os, re, sys

          version = sys.argv[1]
          base_version = sys.argv[2]
          path = "CHANGELOG.md"
          if not os.path.exists(path):
              sys.exit(0)

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          sections = re.split(r'(?m)^## \[([^\]]+)\].*$', text)
          # sections = [preamble, header1, body1, header2, body2, ...]
          pairs = [(sections[i].strip(), sections[i + 1].strip()) for i in range(1, len(sections) - 1, 2)]

          chosen = ""
          for target in (version, f"v{version}", base_version, "Unreleased"):
              for hdr, body in pairs:
                  if hdr.lower() == target.lower() and body:
                      chosen = body
                      break
              if chosen:
                  break

          if chosen:
              print(chosen)
          PYEOF
            )
          fi

          if [ -z "$NOTES" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
            else
              PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            fi
            if [ -n "$PREV_TAG" ]; then
              NOTES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
            else
              NOTES=$(git log --pretty=format:"- %s" -20)
            fi
            if [ -n "$NOTES" ]; then
              NOTES="## Changes"$'\n'"$NOTES"
            fi
          fi

          DELIM="EOF_$(openssl rand -hex 16)"
          {
            echo "notes<<${DELIM}"
            echo "$NOTES"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK
        id: signed_apk
        if: steps.meta.outputs.has_signing_key == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEY" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
          KEYSTORE_PATH="$KEYSTORE_FILE" gradle assembleRelease
          rm -f "$KEYSTORE_FILE"
          DEST="app/build/outputs/apk/release/KCIKTV-${VERSION}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK (Fallback without Signing Key)
        if: steps.meta.outputs.has_signing_key != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: gradle assembleDebug

      - name: Prepare Debug Release APK
        id: debug_apk
        if: steps.meta.outputs.has_signing_key != 'true'
        run: |
          DEST="app/build/outputs/apk/debug/KCIKTV-${{ steps.meta.outputs.version }}-debug.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: KCIKTV ${{ steps.meta.outputs.tag_name }}
          draft: false
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          files: ${{ steps.signed_apk.outputs.apk_path || steps.debug_apk.outputs.apk_path }}
          body: ${{ steps.meta.outputs.notes }}
          generate_release_notes: ${{ steps.meta.outputs.notes == '' }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KCIKTV-${{ steps.meta.outputs.tag_name }}
          path: ${{ steps.signed_apk.outputs.apk_path || steps.debug_apk.outputs.apk_path }}
